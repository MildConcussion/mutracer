<!doctype html>
<meta charset="utf-8">
<title>Realtime sampling GPU checks</title>
<button id="run">Measure sampling and camera response</button>
<pre id="result"></pre>
<script type="module">
  import {measureRealtimeSampling} from './realtimeSampling.ts';
  document.querySelector('#run').onclick = async event => {
    event.target.disabled = true;
    try {
      document.querySelector('#result').textContent = JSON.stringify(await measureRealtimeSampling(
        new URLSearchParams(location.search).has('webgl') ? 'webgl' : 'webgpu'), null, 2);
    } catch (error) {document.querySelector('#result').textContent = String(error.stack ?? error);}
    finally {event.target.disabled = false;}
  };
</script>
