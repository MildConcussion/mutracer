<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="MuTracer advanced example: OpenPBR layers, a shadow catcher, OIDN denoising and offline PNG export." />
    <title>MuTracer · Advanced</title>
    <link rel="stylesheet" href="./shared/style.css" />
    <style>
      /* The canvas is transparent where the background is; show a checker. */
      body {
        background: repeating-conic-gradient(#2a2a2a 0 25%, #353535 0 50%) 0 0 / 32px 32px;
      }
    </style>
  </head>
  <body>
    <canvas id="main"></canvas>
    <div class="panel">
      <span id="status"></span>
      <label>
        Denoiser
        <select id="denoiser">
          <option value="off">Off</option>
          <option value="jnlm" selected>JNLM (built-in)</option>
          <option value="small">OIDN small</option>
          <option value="standard">OIDN standard</option>
          <option value="cleanAuxLarge">OIDN cleanAuxLarge</option>
          <option value="custom-copy">Custom HDR copy</option>
        </select>
      </label>
      <label>
        Sampling
        <select id="sampling">
          <option value="sobol" selected>Sobol</option>
          <option value="zsobol">ZSobol</option>
          <option value="random">Random</option>
          </select>
      </label>
      <label>
        Offline samples
        <input id="samples" type="number" min="1" max="4096" value="256" />
      </label>
      <button id="export">Render offline and save PNG</button>
    </div>
    <script type="module" src="./advanced.ts"></script>
  </body>
</html>
